        geometry.computeVertexNormals();
        
        // Material and mesh
        const material = new THREE.MeshPhongMaterial({
            color: 0x667eea,
            shininess: 100,
            side: THREE.DoubleSide,
            wireframe: false
        });
        
        const mesh = new THREE.Mesh(geometry, material);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        scene.add(mesh);
        
        // Ground plane
        const groundGeometry = new THREE.PlaneGeometry(100, 100);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x444444 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.1;
        ground.receiveShadow = true;
        scene.add(ground);
        
        // Camera position
        const center = [19.339534999999998, 20.333554499999998, 1.25];
        const maxDim = Math.max(32.71495, 31.077741, 2.5);
        const fov = camera.fov * (Math.PI / 180);
        let cameraZ = Math.abs(maxDim / 2 / Math.tan(fov / 2));
        cameraZ *= 1.5;
        
        camera.position.set(center[0], center[1] + maxDim * 0.5, center[2] + cameraZ);
        camera.lookAt(center[0], center[1], center[2]);
        
        // Mouse controls
        let mouseDown = false;
        let mouseX = 0;
        let mouseY = 0;
        let targetRotationX = 0;
        let targetRotationY = 0;
        
        document.addEventListener('mousedown', (e) => {
            mouseDown = true;
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        document.addEventListener('mousemove', (e) => {
            if (!mouseDown) return;
            
            const deltaX = e.clientX - mouseX;
            const deltaY = e.clientY - mouseY;
            
            targetRotationY += deltaX * 0.005;
            targetRotationX += deltaY * 0.005;
            
            mouseX = e.clientX;
            mouseY = e.clientY;
        });
        
        document.addEventListener('mouseup', () => {
            mouseDown = false;
        });
        
        // Zoom with scroll
        document.addEventListener('wheel', (e) => {
            e.preventDefault();
            camera.position.multiplyScalar(1 + e.deltaY * 0.001);
        }, { passive: false });
        
        // Variables
        let wireframeMode = false;
        let autoRotate = false;
        let lastTime = Date.now();
        let frameCount = 0;
        
        // Functions
        function resetView() {
            targetRotationX = 0;
            targetRotationY = 0;
            mesh.rotation.x = 0;
            mesh.rotation.y = 0;
            camera.position.set(center[0], center[1] + maxDim * 0.5, center[2] + cameraZ);
            camera.lookAt(center[0], center[1], center[2]);
        }
        
        function toggleWireframe() {
            wireframeMode = !wireframeMode;
            material.wireframe = wireframeMode;
        }
        
        function toggleLights() {
            ambientLight.intensity = ambientLight.intensity > 0.3 ? 0.3 : 0.6;
            directionalLight.intensity = directionalLight.intensity > 0.4 ? 0.4 : 0.8;
        }
        
        function rotateAuto() {
            autoRotate = !autoRotate;
        }
        
        function downloadOBJ() {
            alert('OBJ file is already available for download from the web interface.');
        }
        
        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            // Auto rotation
            if (autoRotate) {
                mesh.rotation.y += 0.005;
            } else {
                mesh.rotation.x += (targetRotationX - mesh.rotation.x) * 0.1;
                mesh.rotation.y += (targetRotationY - mesh.rotation.y) * 0.1;
            }
            
            // Update stats
            frameCount++;
            const now = Date.now();
            if (now - lastTime >= 1000) {
                document.getElementById('fps').textContent = frameCount;
                frameCount = 0;
                lastTime = now;
            }
            
            const degrees = (mesh.rotation.y * 180 / Math.PI) % 360;
            document.getElementById('rotation').textContent = degrees.toFixed(0) + '°';
            
            renderer.render(scene, camera);
        }
        
        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
        
        animate();
    </script>
